services:
  lab-router:
    build:
      context: chapters/05-router-container/router
    image: docker-networking-vpc-lab/lab-router:forwarding
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    command: ["sleep", "infinity"]
    networks:
      public_a:
        ipv4_address: 10.10.1.2
      public_b:
        ipv4_address: 10.10.2.2
      app_a:
        ipv4_address: 10.10.11.2
      app_b:
        ipv4_address: 10.10.12.2
      db_a:
        ipv4_address: 10.10.21.2
      db_b:
        ipv4_address: 10.10.22.2
