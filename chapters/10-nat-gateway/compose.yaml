services:
  app-a-test:
    command:
      - sh
      - -c
      - |
        set -eu
        ip route replace 10.10.1.0/24 via 10.10.11.2
        ip route replace 10.10.2.0/24 via 10.10.11.2
        ip route replace 10.10.12.0/24 via 10.10.11.2
        ip route replace 10.10.21.0/24 via 10.10.11.2
        ip route replace 10.10.22.0/24 via 10.10.11.2
        ip route replace default via 10.10.11.3
        sleep infinity

  app-b-test:
    command:
      - sh
      - -c
      - |
        set -eu
        ip route replace 10.10.1.0/24 via 10.10.12.2
        ip route replace 10.10.2.0/24 via 10.10.12.2
        ip route replace 10.10.11.0/24 via 10.10.12.2
        ip route replace 10.10.21.0/24 via 10.10.12.2
        ip route replace 10.10.22.0/24 via 10.10.12.2
        ip route replace default via 10.10.12.3
        sleep infinity

  nat-gateway:
    build:
      context: chapters/10-nat-gateway/nat
    image: docker-networking-vpc-lab/nat-gateway:masquerade
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    command: ["sleep", "infinity"]
    networks:
      app_a:
        ipv4_address: 10.10.11.3
      app_b:
        ipv4_address: 10.10.12.3
      nat_public:
        ipv4_address: 10.10.30.2

  nat-public-test:
    build:
      context: chapters/04-capabilities/tools
    image: docker-networking-vpc-lab/lab-tools:latest
    command: ["python3", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
    networks:
      nat_public:
        ipv4_address: 10.10.30.10

networks:
  nat_public:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.30.0/24
          gateway: 10.10.30.1
