services:
  public-a-test:
    networks:
      public_a:
        ipv4_address: 10.10.1.10

  public-b-test:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    networks:
      public_b:
        ipv4_address: 10.10.2.10

  app-a-test:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    networks:
      app_a:
        ipv4_address: 10.10.11.10

  app-b-test:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    networks:
      app_b:
        ipv4_address: 10.10.12.10

  db-a-test:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    networks:
      db_a:
        ipv4_address: 10.10.21.10

  db-b-test:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    networks:
      db_b:
        ipv4_address: 10.10.22.10

networks:
  public_a:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24
          gateway: 10.10.1.1

  public_b:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.2.0/24
          gateway: 10.10.2.1

  app_a:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.11.0/24
          gateway: 10.10.11.1

  app_b:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.12.0/24
          gateway: 10.10.12.1

  db_a:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.21.0/24
          gateway: 10.10.21.1

  db_b:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.22.0/24
          gateway: 10.10.22.1
